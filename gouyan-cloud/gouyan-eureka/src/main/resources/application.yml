spring:
  application:
    name: gouyan-eureka
  profiles:
    active: peer1

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true

# 暴露基础监控端点
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# 微服务基本信息
info:
  app:
    name: ${spring.application.name}
    description: 微服务注册、服务发现、心跳续约及高可用注册中心集群
    version: 0.0.1-SNAPSHOT
    port: ${server.port}