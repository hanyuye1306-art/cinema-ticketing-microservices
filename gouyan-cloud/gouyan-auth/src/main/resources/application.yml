# Spring 配置
spring:
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:true}
      mail.smtp.ssl.enable: ${SMTP_SSL:false}
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 3000
  # 数据源配置文件
  profiles:
    active: druid

  # 开发工具，配置热部署
  devtools:
    restart:
      enabled: true #热部署
  freemarker:
    cache: false #页面不开启缓存，修改即生效

  # jackson日期格式配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  # mvc日期格式配置
  mvc:
    format:
      date: yyyy-MM-dd
      date-time: yyyy-MM-dd HH:mm:ss

  # 文件上传大小限制
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  application:
    name: gouyan-auth

# Account recovery mail is opt-in; credentials are supplied through environment variables.
gouyan:
  account:
    mail-enabled: ${SMTP_ENABLED:false}
    mail-from: ${SMTP_FROM:${SMTP_USERNAME:}}

# Mybatis 配置
mybatis:
  type-aliases-package: com.gouyan.**.domin #指定封装到实体类的包，省去书写全类名
  mapper-locations: classpath*:mapper/**/*Mapper.xml #mapper配置文件的位置
  configuration:
    map-underscore-to-camel-case: true #配置开启驼峰式命名

# logging 日志配置
logging:
  level:
    com.gouyan: trace
    org.springframework: warn

# pagehelper 分页插件配置
pagehelper:
  helperDialect: mysql
  reasonable: true
  supportMethodsArguments: true
  params: count=countSql

server:
  port: 9002

# anji-plus验证码配置
aj:
  captcha:
    water-mark:


eureka:
  client: #客户端注册进eureka服务列表内
    service-url:
      defaultZone: http://127.0.0.1:7001/eureka/,http://127.0.0.1:7002/eureka/
  instance:
    instance-id:  ${spring.application.name}:${server.port}

hystrix:
  command:
    default:  #default全局有效，service id指定应用有效
      execution:
        timeout:
          enabled: true
        isolation:
          thread:
            timeoutInMilliseconds: 5000 #断路器超时时间，默认1000ms
