server:
  port: 8181

spring:
  application:
    name: cloud-gateway
  devtools:
    restart:
      enabled: true
  profiles:
    active: dev
  cloud:
    config:
      fail-fast: true
      name: ${spring.application.name}
      profile: ${spring.profiles.active}
      discovery:
        enabled: true
        service-id: cloud-gateway
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        # 演员、电影演员关联和演员角色。
        # 用 Path 匹配请求，以 lb:// 服务名查实例，StripPrefix=0 保留原始路径。
        - id: gouyan-actor
          uri: lb://gouyan-actor
          predicates:
            - Path=/sysActor/**,/sysActorMovie/**,/sysActorRole/**
          filters:
            - StripPrefix=0
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

        # 用户、兴趣、角色、资源、场次、验证码与文件。
        - id: gouyan-auth
          uri: lb://gouyan-auth
          predicates:
            - Path=/sysResource/**,/sysRole/**,/sysSession/**,/sysUser/**,/sysUserHobby/**,/captcha/**,/upload/**,/images/**
          filters:
            - StripPrefix=0
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

        # 账单以及账单发起的电影远程查询。
        - id: gouyan-bill
          uri: lb://gouyan-bill
          predicates:
            - Path=/sysBill/**
          filters:
            - StripPrefix=0
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin


        # 影院、区域与品牌。
        - id: gouyan-cinema
          uri: lb://gouyan-cinema
          predicates:
            - Path=/sysCinemaArea/**,/sysCinemaBrand/**,/sysCinema/**
          filters:
            - StripPrefix=0
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

        # 影厅及影厅类别。
        - id: gouyan-hall
          uri: lb://gouyan-hall
          predicates:
            - Path=/sysHallCategory/**,/sysHall/**
          filters:
            - StripPrefix=0
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

        # 电影、年代、地区、分类、电影分类关联、评论与时长。
        - id: gouyan-movie
          uri: lb://gouyan-movie
          predicates:
            - Path=/sysMovieAge/**,/sysMovieArea/**,/sysMovieCategory/**,/sysMovieComment/**,/sysMovie/**,/sysMovieRuntime/**,/sysMovieToCategory/**
          filters:
            - StripPrefix=0
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin



eureka:
  client: #客户端注册进eureka服务列表内
    service-url:
      # defaultZone 提供两个 Eureka 端点，instance-id 使用服务名和当前监听端口区分实例。
       defaultZone: http://127.0.0.1:7001/eureka/,http://127.0.0.1:7002/eureka/
  instance:
    instance-id:  ${spring.application.name}:${server.port}
    prefer-ip-address: true     #访问路径可以显示IP地址

hystrix:
    command:
      default:  #default全局有效，service id指定应用有效
        execution:
          timeout:
            enabled: true
          isolation:
            thread:
              timeoutInMilliseconds: 5000 #断路器超时时间，默认1000ms

# 暴露基础监控端点
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# 微服务基本信息
info:
  app:
    name: ${spring.application.name}
    description: API统一网关，负责微服务请求路由、转发与负载均衡
    version: 0.0.1-SNAPSHOT
    port: ${server.port}
